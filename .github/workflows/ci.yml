name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a fast-follow push doesn't
# queue behind (and eventually block on) a run that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Frontend checks, deliberately on ubuntu — free on public repositories and
  # sufficient for the TypeScript side, which has no macOS dependency.
  #
  # The Rust/Tauri side needs macOS (the crate links AppKit/CoreGraphics) and
  # lives in `ci-rust.yml`, in its own workflow so it can carry a `paths:`
  # filter and only run when Rust actually changes — `paths:` applies
  # per-workflow, not per-job. That filter is the cost control that made it
  # safe to add back after macOS minutes exhausted this account's quota once
  # while the repo was private (see `.claude/learned/034_*`).
  #
  # Running the Rust checks locally before pushing is still the fast path:
  #   make lint && make test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before actions/setup-node's pnpm cache step
      # runs `pnpm store path`. Version comes from package.json's
      # "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter desktop lint

      - name: Tests
        run: pnpm --filter desktop test
